version: "3.9"

services:

  backend:
    build: .

    container_name: llm_backend

    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: always


  celery_worker:
    build: .

    container_name: llm_worker

    command: >
      celery -A tasks worker
      --loglevel=info

    env_file:
      - .env

    restart: always